name: Build EnhancendMouseFeatures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build :fabric:testmodClientClasses --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EnhancendMouseFeatures-Fabric-26.2
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error
